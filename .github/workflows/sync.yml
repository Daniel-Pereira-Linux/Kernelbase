name: Sync kernel data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-kernel-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch kernel.org releases
        continue-on-error: true
        run: python3 scripts/fetch_kernel_releases.py

      # Isolated from the two steps above/below: a failure here must never
      # prevent kernel-releases.json or news.json from being committed.
      - name: Fetch patches from lore.kernel.org
        continue-on-error: true
        run: python3 scripts/fetch_patches.py

      # Runs even if any fetch step above failed, and only commits the
      # files that actually changed.
      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kernel-releases.json patches.json
          if git diff --cached --quiet; then
            echo "Nada para commitar."
            exit 0
          fi
          git commit -m "chore: sync kernel releases and patches"
          git push
