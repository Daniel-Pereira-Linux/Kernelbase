name: Atualizar notícias

# Busca as notícias (Kernel.org, LWN, Phoronix, Planet Kernel, 9to5Linux),
# traduz para português e grava em news.json. Roda sozinho a cada 3 horas.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -q feedparser deep-translator beautifulsoup4

      - name: Buscar e traduzir notícias
        run: python3 scripts/fetch_news.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "Nada novo."
            exit 0
          fi
          git commit -m "chore: atualizar notícias"
          for i in 1 2 3; do
            git pull --rebase origin gh-pages && git push && exit 0
            sleep 5
          done
          exit 1
